<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1C3A1C;--bg2:#254525;--bg3:#2E5E2E;--border:#3A6A3A;
  --white:#FFFFFF;--dim:#C8C8C8;
  --yellow:#F5E642;--blue:#A8D8EA;--orange:#FFB347;--green:#98FB98;
  --impact:'Impact','Arial Narrow',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',Calibri,sans-serif;background:var(--bg);color:var(--white);display:flex;flex-direction:column}

/* ── header ── */
header{flex-shrink:0;background:var(--bg2);border-bottom:2px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px}
.logo{font-family:var(--impact);font-size:11px;color:var(--dim);letter-spacing:3px}
h1{font-family:var(--impact);font-size:22px;color:var(--white)}
h1 span{color:var(--yellow)}
.mode-btn{margin-left:auto;font-size:11px;padding:4px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--dim);cursor:pointer;transition:all .2s}
.mode-btn:hover{border-color:var(--yellow);color:var(--yellow)}
body.teacher .mode-btn{color:var(--green);border-color:var(--green)}

/* ── topic tabs ── */
.topics{flex-shrink:0;display:flex;border-bottom:2px solid var(--border);background:var(--bg2)}
.topic-btn{flex:1;padding:10px 4px;font-size:13px;font-weight:bold;border:none;background:transparent;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.topic-btn:hover{color:var(--white)}
.topic-btn.active{color:var(--yellow);border-bottom-color:var(--yellow)}

/* ── content tabs ── */
.content-tabs{flex-shrink:0;display:flex;gap:2px;padding:6px 12px;background:var(--bg)}
.tab-btn{font-size:11px;padding:4px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--dim);cursor:pointer;transition:all .2s}
.tab-btn:hover{border-color:var(--white);color:var(--white)}
.tab-btn.active{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow);font-weight:bold}

/* ── panels ── */
.topic-section{flex:1;min-height:0;display:none;flex-direction:column}
.topic-section.active{display:flex}
.panel{position:absolute;inset:0;overflow-y:auto;padding:18px;display:none;background:var(--bg)}
.panel.active{display:block;animation:fade-in .2s ease}
#panel-carousel.active{display:flex;flex-direction:column;padding:6px;overflow:hidden}
body.teacher #panel-carousel.active{padding-right:270px}
.panel-wrap{position:relative;flex:1;min-height:0}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── carousel ── */
.carousel{display:flex;flex-direction:column;height:100%;gap:6px}
.slide-frame{flex:1;min-height:0;width:100%;background:#000;border:2px solid var(--border);border-radius:4px;overflow:hidden}
.slide-frame img{width:100%;height:100%;object-fit:contain;display:block}
.carousel-nav{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:4px 0}
.nav-btn{background:var(--bg2);border:1px solid var(--border);color:var(--white);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;transition:all .2s}
.nav-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.slide-counter{font-size:13px;color:var(--dim);min-width:60px;text-align:center}

/* ── quiz ── */
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.q-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px}
.q-text{font-size:14px;margin-bottom:12px;line-height:1.5}
.q-options{display:flex;flex-direction:column;gap:6px}
.q-opt{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px;transition:all .2s;text-align:left}
.q-opt:hover{border-color:var(--yellow)}
.q-opt.correct{background:rgba(152,251,152,.2);border-color:var(--green);color:var(--green)}
.q-opt.wrong{background:rgba(255,100,100,.15);border-color:#f88;color:#f88}

/* ── infographic ── */
.info-img{width:100%;border-radius:8px;border:1px solid var(--border)}

/* ── video ── */
.video-wrap{width:100%;max-width:800px;margin:0 auto;aspect-ratio:16/9}
.video-wrap iframe{width:100%;height:100%;border:none;border-radius:8px}

/* ── float panel (teacher) ── */
.float-panel{position:fixed;top:80px;right:12px;width:250px;background:var(--bg2);border:2px solid var(--border);border-radius:10px;padding:14px;display:none;flex-direction:column;gap:12px;z-index:600}
body.teacher .float-panel{display:flex}
.fp-title{font-family:var(--impact);font-size:12px;letter-spacing:2px;color:var(--dim)}
.fp-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
.fp-close:hover{color:var(--yellow)}

/* timer */
.timer-display{font-family:var(--impact);font-size:40px;text-align:center;color:var(--yellow);letter-spacing:2px}
.timer-btns{display:flex;gap:6px;justify-content:center}
.timer-btns button{flex:1;padding:6px;background:var(--bg3);border:1px solid var(--border);color:var(--white);border-radius:6px;cursor:pointer;font-size:12px}
.timer-btns button:hover{border-color:var(--yellow)}

/* chalk draw */
.draw-btns{display:flex;gap:6px;flex-wrap:wrap}
.draw-btn{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);color:var(--white);border-radius:6px;cursor:pointer;font-size:11px}
.draw-btn:hover,.draw-btn.active{border-color:var(--yellow);color:var(--yellow)}
#drawCanvas{position:fixed;inset:0;z-index:500;pointer-events:none;display:none}
#drawCanvas.active{pointer-events:all}
</style>
</head>

<script>

// ── BASE URL (file:// & HTTP) ──
const BASE = (() => {
  const href = window.location.href;
  if (href.startsWith('file://')) return href.replace(/[^/\\]*$/, '');
  return '';
})();
function imgSrc(f) { return BASE + f; }

// ── Mode ──
const modeBtn = document.getElementById('modeBtn');
modeBtn.addEventListener('click', () => {
  document.body.classList.toggle('teacher');
  modeBtn.textContent = document.body.classList.contains('teacher') ? '👨‍🏫 教師模式' : '🎓 學生模式';
});

// ── Topics & Tabs ──
const topicBtns = document.querySelectorAll('.topic-btn');
const topicSections = document.querySelectorAll('.topic-section');
topicBtns.forEach((btn, i) => {
  btn.addEventListener('click', () => {
    topicBtns.forEach(b => b.classList.remove('active'));
    topicSections.forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    topicSections[i].classList.add('active');
    initSection(topicSections[i]);
  });
});

function switchTab(section, tab) {
  section.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  section.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const panel = section.querySelector('#panel-' + tab);
  const btn = section.querySelector('[data-tab="' + tab + '"]');
  if (panel) panel.classList.add('active');
  if (btn) btn.classList.add('active');
  if (tab !== 'video') {
    const f = section.querySelector('iframe');
    if (f) f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}','*');
  }
}

function initSection(section) {
  const firstTab = section.querySelector('.tab-btn');
  if (firstTab) switchTab(section, firstTab.dataset.tab);
  initCarousel(section);
  initQuiz(section);
}

// activate first topic
topicBtns[0].click();

// ── Carousel ──
function initCarousel(section) {
  const slides = section.querySelectorAll('.slide-img');
  const counter = section.querySelector('.slide-counter');
  let cur = 0;
  function show(n) {
    cur = (n + slides.length) % slides.length;
    slides.forEach((s, i) => s.style.display = i === cur ? 'block' : 'none');
    if (counter) counter.textContent = (cur+1) + ' / ' + slides.length;
  }
  section.querySelector('.prev-btn')?.addEventListener('click', () => show(cur - 1));
  section.querySelector('.next-btn')?.addEventListener('click', () => show(cur + 1));
  show(0);
}

// ── Quiz ──
const QUIZZES = [[{'q': '【AutoNM前置設定】問題一（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 0}, {'q': '【AutoNM前置設定】問題二（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 1}], [{'q': '【工作流程狀態機】問題一（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 0}, {'q': '【工作流程狀態機】問題二（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 1}], [{'q': '【NM設備啟動程序】問題一（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 0}, {'q': '【NM設備啟動程序】問題二（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 1}], [{'q': '【太陽能板展開程序】問題一（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 0}, {'q': '【太陽能板展開程序】問題二（請依教材內容修改）', 'opts': ['選項 A', '選項 B', '選項 C', '選項 D'], 'ans': 1}]];

function initQuiz(section) {
  const idx = [...topicSections].indexOf(section);
  const container = section.querySelector('.quiz-grid');
  if (!container || !QUIZZES[idx]) return;
  container.innerHTML = '';
  QUIZZES[idx].forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = '<div class="q-text">' + q.q + '</div>' +
      '<div class="q-options">' +
      q.opts.map((o,i) => '<button class="q-opt" data-i="'+i+'">'+o+'</button>').join('') +
      '</div>';
    card.querySelectorAll('.q-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        card.querySelectorAll('.q-opt').forEach(b => b.classList.remove('correct','wrong'));
        btn.classList.add(+btn.dataset.i === q.ans ? 'correct' : 'wrong');
      });
    });
    container.appendChild(card);
  });
}

// ── Timer ──
let timerInterval, timerSeconds = 0, timerRunning = false;
function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds/60)).padStart(2,'0');
  const s = String(timerSeconds%60).padStart(2,'0');
  document.getElementById('timerDisplay').textContent = m + ':' + s;
}
document.getElementById('timerStart')?.addEventListener('click', () => {
  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; }
  else { timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000); timerRunning = true; }
  document.getElementById('timerStart').textContent = timerRunning ? '⏸ 暫停' : '▶ 開始';
});
document.getElementById('timerReset')?.addEventListener('click', () => {
  clearInterval(timerInterval); timerRunning = false; timerSeconds = 0;
  updateTimerDisplay();
  document.getElementById('timerStart').textContent = '▶ 開始';
});
updateTimerDisplay();

// ── Chalk Draw ──
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let drawing = false, drawActive = false, currentColor = '#FFFFFF', currentSize = 4;
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
document.getElementById('drawToggle')?.addEventListener('click', () => {
  drawActive = !drawActive;
  canvas.classList.toggle('active', drawActive);
  document.getElementById('drawToggle').classList.toggle('active', drawActive);
});
document.getElementById('drawClear')?.addEventListener('click', () => ctx.clearRect(0,0,canvas.width,canvas.height));
document.querySelectorAll('.color-dot').forEach(el => {
  el.addEventListener('click', () => { currentColor = el.dataset.color; });
});
canvas.addEventListener('mousedown', e => { drawing=true; ctx.beginPath(); ctx.moveTo(e.clientX,e.clientY); });
canvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  ctx.lineTo(e.clientX,e.clientY);
  ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
});
canvas.addEventListener('mouseup', () => drawing=false);
canvas.addEventListener('mouseleave', () => drawing=false);

// Load images via BASE
document.querySelectorAll('[data-src]').forEach(img => {
  img.src = imgSrc(img.dataset.src);
});
// Fix topic tab onclick
document.querySelectorAll('.topic-btn').forEach((btn, i) => {
  btn.onclick = () => {
    document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.topic-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    const section = document.querySelectorAll('.topic-section')[i];
    section.classList.add('active');
    initSection(section);
  };
});
</script>
